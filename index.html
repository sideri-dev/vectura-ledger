<style>
:root{
  --ground:#F8F8F5;--surface-1:#FFFFFF;--ink:#1D2126;--muted:#66707E;--line:#E1E3DE;--line-strong:#C9CCC5;
  --accent:#2C4E96;--accent-soft:#EDF1F9;
  --s-breaks:#2a78d6;--s-mixed:#eb6834;--s-supports:#1baf7a;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#131619;--surface-1:#1C2126;--ink:#E6E8EB;--muted:#98A2B0;--line:#2A3038;--line-strong:#3A414B;
  --accent:#82A4E8;--accent-soft:#232B3A;
  --s-breaks:#3987e5;--s-mixed:#d95926;--s-supports:#199e70}}
:root[data-theme="dark"]{
  --ground:#131619;--surface-1:#1C2126;--ink:#E6E8EB;--muted:#98A2B0;--line:#2A3038;--line-strong:#3A414B;
  --accent:#82A4E8;--accent-soft:#232B3A;
  --s-breaks:#3987e5;--s-mixed:#d95926;--s-supports:#199e70}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:840px;margin:0 auto;padding:26px 18px 60px}
header{border-bottom:2px solid var(--ink);padding-bottom:15px;margin-bottom:20px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:6px 0 9px}
.lede{color:var(--muted);font-size:13.5px;margin:0;max-width:64ch}
nav{margin-top:12px;font-size:12.5px}
nav a{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line-strong)}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0 4px}
@media(min-width:560px){.kpi{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface-1);border:1px solid var(--line);border-radius:7px;padding:12px 13px}
.tile .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;line-height:1.1}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:2px}
h2{font-size:17px;font-weight:700;margin:34px 0 4px}
.sub{font-size:13px;color:var(--muted);margin:0 0 16px;max-width:66ch}
.chart{background:var(--surface-1);border:1px solid var(--line);border-radius:8px;padding:18px 16px 12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.sw{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px var(--surface-1)}
.grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 7px;padding-top:11px;border-top:1px dashed var(--line)}
.grp:first-of-type{border-top:0;padding-top:0;margin-top:0}
.r{display:grid;grid-template-columns:1fr;gap:2px;margin-bottom:11px;cursor:pointer;border-radius:5px;padding:3px 2px}
.r:hover,.r:focus-visible{background:var(--accent-soft);outline:none}
.rl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px}
.rl b{font-weight:600}
.rl .mk{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.rl .ix{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px}
.track{position:relative;height:15px}
.track::before{content:"";position:absolute;left:0;right:0;top:7px;height:1px;background:var(--line)}
.par{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--line-strong);border-radius:1px}
.dot{position:absolute;top:1px;width:13px;height:13px;border-radius:50%;margin-left:-6.5px;box-shadow:0 0 0 2px var(--surface-1)}
.axis{position:relative;height:20px;margin-top:6px;border-top:1px solid var(--line)}
.axis i{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-style:normal}
.note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 9px;border-bottom:2px solid var(--line-strong);white-space:nowrap}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-soft)}
tbody tr.on{background:var(--accent-soft)}
.vid{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:12px}
.dr{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12px}
.det td{background:var(--ground);font-size:12.5px;color:var(--muted);line-height:1.65}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 9px}
.det dt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.det dd{margin:0;color:var(--ink)}
.det a{color:var(--accent)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);font-family:var(--mono);line-height:1.8}
</style>
</head>

      document.getElementById("row-"+id).scrollIntoView({block:"center",behavior:"smooth"});}
    el.onclick=go;
    el.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};});
}
render();
})();
</script>
</body>
</html>
